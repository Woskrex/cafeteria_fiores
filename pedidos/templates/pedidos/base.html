
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cafetería Fiores</title>
</head>
<body>
    <h1>Cafetería Fiores</h1>

    <nav>
        {% if user.is_authenticated %}
            <a href="{% url 'inicio' %}">Inicio</a>

            <span>Usuario: {{ user.username }}</span>

            {% if user.is_staff %}
                <span>Rol: Encargado</span>
                <a href="{% url 'panel_encargado' %}">Panel encargado</a>
            {% else %}
                <span>Rol: Cliente</span>
            {% endif %}

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Cerrar sesión</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Iniciar sesión</a>
        {% endif %}
    </nav>

    <main>
        {% block contenido %}
        {% endblock %}
    </main>
</body>
</html>
